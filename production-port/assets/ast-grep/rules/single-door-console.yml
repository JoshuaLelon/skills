# Twin: single-door-console-tsx.yml. ADR-0009: structure in lib/log IS the log
# pipeline; a raw console call is an unindexed, unqueryable string.
id: single-door-console
language: TypeScript
severity: error
message: >-
  Server logging goes through lib/log (one flat JSON object per call — Workers
  Logs indexes every field). Raw console.* is an unqueryable string. (ADR-0009)
files:
  - "src/**"
ignores:
  - "src/lib/log.ts"
  - "src/host.tsx"
  - "src/walkthrough.tsx"
rule:
  pattern: console.$METHOD($$$)
